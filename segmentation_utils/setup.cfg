[metadata]
name = segmentation_utils
version = 0.2.0
description = Segmentation utilities - middleware interface for Hugging Face SAM3 and CLIPSeg
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Eric Martinson

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.12
install_requires =
    torch
    transformers>=5.0
    numpy
    pillow
    opencv-python
    matplotlib
    scikit-learn

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    segmentation-utils-cli = segmentation_utils.cli:main