[metadata]
name = change_pcloud_utils
version = 0.2.0
description = Change detection: 3D change candidates from registered images and Gaussian Splatting renders
license = MIT
author = Eric Martinson

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.12
install_requires =
    segmentation_utils
    torch
    numpy
    scipy
    scikit-learn
    opencv-python
    pillow

[options.packages.find]
where = src

[options.extras_require]
viz =
    open3d
    matplotlib

[options.entry_points]
console_scripts =
    build-change-candidates = change_pcloud_utils.build_change_candidates:main