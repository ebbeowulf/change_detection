[metadata]
name = cluster_filters
version = 0.2.0
description = Change detection: filters for 3D change candidates (DINOv2/ResNet change networks, VLM filters) and their training and evaluation
license = MIT
author = Eric Martinson

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.12
install_requires =
    change_pcloud_utils
    segmentation_utils
    torch
    torchvision
    transformers
    numpy
    scikit-learn
    opencv-python
    pillow
    matplotlib
    json5

[options.packages.find]
where = src